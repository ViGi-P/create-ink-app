name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  node-templates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - library-js
          - library-ts
          - cli-js
          - cli-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - run: rm -rf ./src/__tests__/bun
        working-directory: templates/${{ matrix.template }}
      - run: pnpm install
        working-directory: templates/${{ matrix.template }}
      - run: pnpm add -D @types/node@^24.0.0
        working-directory: templates/${{ matrix.template }}
      - run: pnpm lint
        working-directory: templates/${{ matrix.template }}
      - run: pnpm test
        working-directory: templates/${{ matrix.template }}

  bun-templates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - library-js
          - library-ts
          - cli-js
          - cli-ts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: rm -rf ./src/__tests__/node
        working-directory: templates/${{ matrix.template }}
      - run: bun install
        working-directory: templates/${{ matrix.template }}
      - run: bun add -D @types/bun@latest
        working-directory: templates/${{ matrix.template }}
      - run: bun test src/__tests__/bun
        working-directory: templates/${{ matrix.template }}
